# The CMS writes JSON. This turns that JSON back into pages.
#
# WHY IT IS NEEDED AT ALL. `/keystatic` commits `data/**.json`, but this site
# serves GENERATED HTML out of `public/_pages/v3/`. Without this workflow an
# editor's save changes a data file and nothing visible happens — the edit is
# invisible until someone runs the generators by hand. That would make the CMS
# look broken in exactly the way that destroys trust in it.
#
# ★ IT ALSO GUARDS THE EDIT. Keystatic SERIALISES ITS SCHEMA rather than
# patching the file, so a key the schema does not declare is dropped on save,
# and `null` becomes `""` because Keystatic has no `string | null`. On this data
# that is not cosmetic: `holes[]`, `basis`, `source` and `period` are the
# provenance the site argues from, and `situation: ""` fails the work build
# outright. So every content commit is normalised and then CHECKED against its
# own parent commit before anything is rebuilt.

name: Content rebuild — the CMS writes JSON, this writes the pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'content/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Normalise, check and rebuild, but commit nothing'
        type: boolean
        default: true

concurrency:
  # Two overlapping runs would both rebuild and both try to push.
  group: content-rebuild
  cancel-in-progress: false

permissions:
  # Needed to push the normalised data and the rebuilt pages.
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Do not answer our own commits, or the two bots would rebuild each other
    # forever. data-refresh already rebuilds the pages it touches in its own
    # run, so its commits need nothing from here either.
    #
    # ★ THE LIST WAS MISSING THREE BOTS (found 29 August, storage-growth
    # audit). air-hourly.yml, climate-events.yml and climate-coverage-hourly.yml
    # also commit to `data/**`, which is this workflow's own trigger path — so
    # every one of their pushes ALSO started a content-rebuild run. It never
    # produced a second commit (those bots already rebuild their own pages in
    # the same transaction, so this job found nothing left to stage), but it
    # still checked out, ran `npm ci` and rebuilt all eleven page types for
    # nothing, on every 15- and 30-minute tick, all day. Pure waste, not a
    # second deployment — but there was no reason to keep paying it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ( github.event.head_commit.author.name != 'swechha-content-rebuild[bot]' &&
        github.event.head_commit.author.name != 'swechha-data-refresh[bot]' &&
        github.event.head_commit.author.name != 'swechha-air[bot]' &&
        github.event.head_commit.author.name != 'swechha-climate-events[bot]' &&
        github.event.head_commit.author.name != 'swechha-coverage-hourly[bot]' )
    steps:
      # depth 2, because the fidelity check needs the PARENT commit as its
      # reference — "what did this file look like before the editor saved it".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The generators use node built-ins only; dev dependencies are not needed.
      - run: npm ci --omit=dev

      - name: Take the parent commit's data as the reference
        id: ref
        run: |
          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "No parent commit — nothing to compare against. Skipping the guard."
            echo "have=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/ref
          git archive HEAD~1 data | tar -x -C /tmp/ref
          echo "have=1" >> "$GITHUB_OUTPUT"
          echo "Reference: $(find /tmp/ref/data -name '*.json' | wc -l | tr -d ' ') json file(s) from $(git rev-parse --short HEAD~1)"

      # Keystatic cannot express `null`. Put the nulls back BEFORE the guard
      # runs, or the guard would correctly fail on every single save.
      - name: Restore the nulls Keystatic cannot write
        if: steps.ref.outputs.have == '1'
        run: node scripts/normalize-cms-output.mjs /tmp/ref/data data

      # ★ IS THIS A CMS SAVE, OR A HAND-AUTHORED MIGRATION? The gate below exists
      #   for ONE failure mode, named in this file's own header: Keystatic
      #   serialises its schema, so a key the schema does not declare is silently
      #   dropped on save. It cannot tell that from a developer changing the shape
      #   ON PURPOSE, and it refused exactly that on AD-39 — which removed
      #   `impact.json`'s `act.doors`, added `act.tabs`, and moved
      #   `build-impact-page.mjs` to read `tabs` in the same commit. The key really
      #   was deleted; the deletion really was reviewed.
      #
      #   THE DISCRIMINATOR IS THE ONE THING KEYSTATIC CANNOT DO. It writes
      #   `data/**` and `content/**` and has no route to `scripts/`. So a commit
      #   that changes a generator alongside the data is, by construction, not a
      #   CMS save: it is a migration, with the reader of the new shape changed in
      #   the same commit and visible in the same diff.
      #
      #   THE GUARD IS NOT WEAKENED FOR THE CASE IT WAS WRITTEN FOR. On a real
      #   Keystatic save `scripts/` is untouched and the check is fatal exactly as
      #   before. On a migration it still RUNS and still PRINTS every difference —
      #   it just does not stop the rebuild, so the losses stay visible in the log
      #   and a genuine mistake is still there to be read.
      - name: Is this a CMS save, or a hand-authored migration?
        id: kind
        if: steps.ref.outputs.have == '1'
        run: |
          if git diff --name-only HEAD~1 HEAD -- scripts | grep -q .; then
            echo "A generator changed in this commit:"
            git diff --name-only HEAD~1 HEAD -- scripts | sed 's/^/  /'
            echo "Keystatic cannot write scripts/, so this is a reviewed migration, not a save."
            echo "cms=0" >> "$GITHUB_OUTPUT"
          else
            echo "No generator changed — treating this as a CMS save. The fidelity gate is fatal."
            echo "cms=1" >> "$GITHUB_OUTPUT"
          fi

      # THE GATE. A save may change a value; it may not delete one.
      - name: Refuse a save that lost anything
        if: steps.ref.outputs.have == '1' && steps.kind.outputs.cms == '1'
        run: node scripts/verify-data-fidelity.mjs /tmp/ref/data data

      # The same comparison, reported and not enforced, for a migration.
      - name: Report what the migration changed
        if: steps.ref.outputs.have == '1' && steps.kind.outputs.cms == '0'
        run: |
          node scripts/verify-data-fidelity.mjs /tmp/ref/data data \
            || echo "::notice::Keys changed shape in this commit. Not fatal here — a generator changed in the same commit, so this is a migration and the diff above is the record of it."

      - name: Rebuild the pages the content feeds
        run: |
          # ── ONE REBUILD, SHARED WITH EVERY OTHER PUBLISHER ──────────────
          # This was a loop of eleven targets, and it was missing seven that
          # the gate rebuilds: healthy-cities, learn, schools, journal, data,
          # record and the share cards. A content edit that touched any of
          # those left them stale on main and the next pull request anyone
          # opened failed generated-current.yml for a page its author had not
          # been near. Five publishers each had a list; none of them agreed.
          #
          # build:all holds the order once, including the constraint this
          # comment used to state backwards. It is SITUATIONS BEFORE HERO, not
          # hero first: build-hero.mjs reads the air figure out of the built
          # situation-air.html and refuses to write when the two disagree. The
          # old ordering was safe HERE — this workflow never touches the
          # fetched datasets, so the hero recomputed the same figure the
          # committed page already showed — but it was safe by luck of scope,
          # and build-hero.mjs's own note records data-refresh going red on
          # most days it had anything to report until that order was fixed.
          npm run build:all
          npm run verify:final

      - name: Commit the rebuilt pages
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  'swechha-content-rebuild[bot]'
          git config user.email 'actions@github.com'
          # ── ONE STAGING LIST, SHARED WITH EVERY OTHER PUBLISHER ─────────
          # design/ is a build output too, and leaving it out once broke every
          # PR: build-hero.mjs writes BOTH design/home.html (the source,
          # comments intact) and public/_pages/v3/home.html (the shipped,
          # stripped copy), and staging only the second left the source stale.
          # This list also had no public/data and no public/images. The trees
          # are named once now, in the script, with the whole account.
          ./scripts/stage-generated.sh
          if git diff --cached --quiet; then
            echo "Nothing staged after the rebuild — the edit needed no page change."
            exit 0
          fi
          changed=$(git diff --cached --name-only -- data | sed 's|^data/||' | tr '\n' ' ')
          # Which PAGES changed, for the IndexNow step after the push. Recorded
          # here because the staged list is only available before the commit.
          changed_pages=$(git diff --cached --name-only -- 'public/_pages/**/*.html' | tr '\n' ' ')
          echo "CHANGED_PAGES=$changed_pages" >> "$GITHUB_ENV"
          git commit -m "content: the pages catch up with the edit" \
            -m "Edited: ${changed:-none}" \
            -m "Automated by .github/workflows/content-rebuild.yml, answering a content commit. The nulls Keystatic cannot express were restored, no key was lost against the parent commit, and every generator gate passed — so no page is out of step with the data under it."
          git push

      # ── TELL THE SEARCH ENGINES, AFTER THE PUSH ─────────────────────────
      # One POST reaches Bing, Yandex, Seznam and Naver. Google does not
      # participate in IndexNow and both legacy sitemap pings are gone
      # (google.com/ping answers 404 "Sitemaps ping is deprecated",
      # bing.com/ping answers 410); Google's stated replacement is the sitemap
      # `lastmod`, which this repo already computes from a content hash.
      #
      # AFTER the push, because IndexNow verifies ownership by fetching the key
      # file from the live host. A rejection never fails the run: the page is
      # already published and correct, and this is only a notification.
      - name: Submit the changed pages to IndexNow
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if [ -z "${CHANGED_PAGES// /}" ]; then
            echo "No page files changed — nothing to submit."
            exit 0
          fi
          node scripts/ping-indexnow.mjs --changed "$CHANGED_PAGES"
