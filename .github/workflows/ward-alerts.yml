name: Watch your ward — hourly alert check

# GitHub Actions rather than Vercel cron: Vercel's Hobby plan caps scheduled
# functions at one a day, and CPCB publishes hourly.
#
# ★ THIS WORKFLOW CANNOT SEND ANYTHING UNTIL THREE SECRETS EXIST. Until then
# every run stops at the guard in scripts/ward-alerts.mjs with a clear message,
# which is the intended behaviour — a scheduled job that quietly does nothing is
# worse than one that says why.
#
#   DATA_GOV_IN_KEY   the CPCB feed, from data.gov.in
#   DATABASE_URL      Neon Postgres; run db/001-ward-subscriptions.sql first
#   RESEND_API_KEY    Resend, for the two emails
#
# Add them under Settings → Secrets and variables → Actions.

on:
  schedule:
    # Hourly at :20. Deliberately not :00 — CPCB stamps the hour and publishes
    # a little after it, and every cron on earth fires at :00.
    # ★ HOURLY, ALL NIGHT — THE ONE JOB EXEMPT FROM THE QUIET HOURS.
    # Everything else on this repository's schedule stops between midnight and
    # 05:00 IST (owner's instruction, 5 September). This does not, and the
    # exemption is deliberate: Delhi's air is frequently at its WORST in those
    # hours, so the window this job would have skipped is the window a person
    # who asked to be told most needs telling in. Briefly blacked out on
    # 5 September and reversed the same day.
    #
    # THE EXEMPTION IS AFFORDABLE BECAUSE THIS JOB COMMITS NOTHING. Every commit
    # to main is a Vercel deployment and the quiet hours exist to protect that
    # budget; this pushes no commit, so running it 24 times a day costs zero
    # deployments. lib/workflows.test.ts holds the exemption by name and asserts
    # that condition — add a commit step here and the test fails, correctly,
    # because the exemption would no longer be free.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and report without sending or writing'
        type: boolean
        default: true

concurrency:
  # Two overlapping runs could both see the same crossing and both mail it.
  group: ward-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: Check for crossings and send
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          # The transport ladder's relay rung (AD-45) — this job alerts
          # PEOPLE, so it least of all can afford a runner whose egress to the
          # CPCB hosts has died, as it did on 26 August 2026. Exit 75 now
          # means direct fetch AND curl AND the relay were all silent.
          AIR_RELAY_TOKEN: ${{ secrets.AIR_RELAY_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WARD_MAIL_FROM: ${{ vars.WARD_MAIL_FROM }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          # EXIT 75 IS NOT A FAILURE — the same rule as air-hourly.yml. The
          # script exits 75 when CPCB does not answer, having sent nothing and
          # changed nothing, which is the correct behaviour for a silent
          # source rather than a defect here. data.gov.in refused about half
          # of these hourly runs between 23 and 26 August 2026; turning the
          # job red for it emailed a human every other hour about someone
          # else's server. A real error still exits non-zero and still fails.
          set +e
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/ward-alerts.mjs --dry-run
          else
            node scripts/ward-alerts.mjs
          fi
          code=$?
          set -e
          if [ "$code" = "75" ]; then
            echo "::notice::CPCB did not answer. No alerts evaluated, none sent, nothing changed."
            exit 0
          fi
          exit "$code"
