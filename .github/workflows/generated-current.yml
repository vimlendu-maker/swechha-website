name: Generated pages are current

# WHY THIS EXISTS
# Vercel builds `next build` and nothing else. The 29 pages under
# public/_pages/v3 are COMMITTED build artefacts, generated by scripts/build-*.mjs
# from data/. So if anyone edits a dataset or a generator and pushes without
# re-running the builds, Vercel ships the old HTML, readers see a stale figure,
# and every gate in the repo passes because none of them ever ran.
#
# The daily data-refresh workflow keeps the pages in step with the SOURCES. This
# keeps them in step with the REPOSITORY, which is a different failure: a human
# editing data/act.json at 1am.
#
# It regenerates everything and fails if the working tree moved. The fix when it
# fails is always the same and is printed in the log: run the builds and commit
# the result.
#
# THIS IS ALSO THE ACCEPTANCE GATE FOR THE SEO REGISTER (`npm test`).
# `verify-seo.mjs` only proves the shipped HTML matches data/seo/pages.json —
# it is tautological about the register's own values. Every register
# invariant (title <= 60 rendered chars, title/description/indexName
# uniqueness, the thin-title TERMS rule, description length) lives solely in
# lib/seo/register.test.ts, run by `npm test` below. build-work-pages.mjs's
# shell has no description-length gate of its own, so for the 15 WORK pages
# the test suite is the ONLY thing enforcing it. Without `npm test` in this
# workflow, a new page with a copy-pasted description and a too-long title
# builds clean, verifies clean, and ships a duplicate meta description.
# `npm run lint` runs too, since it currently exits 0 (warnings only, no
# errors) — if it ever starts failing the build, that has to be fixed at the
# source, not by dropping the step.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Enforces the register invariants that verify:seo cannot: title length,
      # title/description/indexName uniqueness, the thin-title TERMS rule, and
      # description length (the only gate at all for the 15 WORK pages). Runs
      # before the build so a broken register fails fast, before spending time
      # regenerating 29 pages against it.
      - name: Test and lint
        run: |
          npm test
          npm run lint

      # Hero first: every other generator extracts the nav, footer and token
      # block out of home.html and must not read it before the readings land.
      - name: Regenerate every page
        run: |
          npm run build:hero
          for t in situations work about impact farm act stories publications posters search essays; do
            npm run "build:$t"
          done
          npm run verify:final
          npm run verify:seo

      - name: Fail if the committed pages were not in step
        run: |
          if ! git diff --quiet; then
            echo "::error::The committed pages are out of step with data/ and scripts/."
            echo ""
            echo "These files changed when the generators ran:"
            git diff --name-only | sed 's/^/  /'
            echo ""
            echo "Fix: run the generators locally and commit the result —"
            echo "  npm run build:hero && for t in situations work about impact farm act stories publications posters search essays; do npm run build:\$t; done"
            echo ""
            git --no-pager diff --stat
            echo ""
            echo "What actually differs (first 200 lines) — a --stat alone has"
            echo "never been enough to tell an environment-dependent value from a"
            echo "forgotten rebuild, and that distinction is the whole diagnosis:"
            git --no-pager diff | head -200
            exit 1
          fi
          echo "Every generated page matches its inputs."
