name: Generated pages are current

# WHY THIS EXISTS
# Vercel builds `next build` and nothing else. The 29 pages under
# public/_pages/v3 are COMMITTED build artefacts, generated by scripts/build-*.mjs
# from data/. So if anyone edits a dataset or a generator and pushes without
# re-running the builds, Vercel ships the old HTML, readers see a stale figure,
# and every gate in the repo passes because none of them ever ran.
#
# The daily data-refresh workflow keeps the pages in step with the SOURCES. This
# keeps them in step with the REPOSITORY, which is a different failure: a human
# editing data/act.json at 1am.
#
# It regenerates everything and fails if the working tree moved. The fix when it
# fails is always the same and is printed in the log: run the builds and commit
# the result.
#
# THIS IS ALSO THE ACCEPTANCE GATE FOR THE SEO REGISTER (`npm test`).
# `verify-seo.mjs` only proves the shipped HTML matches data/seo/pages.json —
# it is tautological about the register's own values. Every register
# invariant (title <= 60 rendered chars, title/description/indexName
# uniqueness, the thin-title TERMS rule, description length) lives solely in
# lib/seo/register.test.ts, run by `npm test` below. build-work-pages.mjs's
# shell has no description-length gate of its own, so for the 15 WORK pages
# the test suite is the ONLY thing enforcing it. Without `npm test` in this
# workflow, a new page with a copy-pasted description and a too-long title
# builds clean, verifies clean, and ships a duplicate meta description.
# `npm run lint` runs too, since it currently exits 0 (warnings only, no
# errors) — if it ever starts failing the build, that has to be fixed at the
# source, not by dropping the step.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Enforces the register invariants that verify:seo cannot: title length,
      # title/description/indexName uniqueness, the thin-title TERMS rule, and
      # description length (the only gate at all for the 15 WORK pages). Runs
      # before the build so a broken register fails fast, before spending time
      # regenerating 29 pages against it.
      - name: Test, type-check and lint
        run: |
          npm test
          # ★ NOTHING ELSE IN THIS REPOSITORY RUNS tsc, AND VERCEL DOES.
          # On 2026-09-11 a dotAll regex in a TEST FILE broke every production
          # deployment: vitest transpiles without type-checking, eslint does
          # not type-check, and this gate did not either -- but `next build`
          # type-checks the WHOLE repository, test files included. Every gate
          # was green while the site could not deploy at all.
          #
          # `npm run typecheck` runs `next typegen` first, and must: PageProps and
          # LayoutProps are GENERATED into .next/types by the build, so bare tsc on a
          # fresh clone fails with 'Cannot find name PageProps' — which is exactly how
          # this step failed the first time it ran here. typegen takes 0.3s and makes
          # the check work from a cold checkout, before any build has happened.
          npm run typecheck
          npm run lint

      # ── THE SAME REBUILD THE PUBLISHERS RUN, WHICH IS THE POINT ─────────
      # ★ THIS LIST WAS THE AUTHORITATIVE ONE AND IT WAS STILL WRONG TWICE.
      # A gate that rebuilds differently from the publishers is checking a tree
      # nobody produces, and that is exactly how both mistakes survived:
      #
      #   HERO FIRST. The comment here read "every other generator extracts the
      #   nav, footer and token block out of home.html and must not read it
      #   before the readings land" — true, but those generators extract from
      #   design/home.html, the hand-maintained SOURCE, and from seven pinned
      #   line ranges of tokens and chrome that a reading never moves. What DOES
      #   depend on order is the other direction: build-hero.mjs reads the air
      #   figure out of the BUILT situation-air.html and refuses to write when
      #   it disagrees with the dataset. Its own note records data-refresh going
      #   red "on most days it had anything to report" for precisely this. The
      #   gate got away with it because it starts from a tree already in step.
      #
      #   SEARCH BEFORE ESSAYS. build-search-page.mjs reads the built pages and
      #   stores each one's headings and hook as its search text, so an essay
      #   rebuilt after it was missing from the index until something else ran.
      #
      # Both are fixed in scripts/build-all.sh, once, for the gate and the five
      # publishers together. The share cards stay last and before the verifiers
      # for the reason that was always right: each generator derives its own
      # page's og:image through scripts/lib/social-image.mjs, so on a healthy
      # tree this writes nothing and the diff below stays green — it is there
      # for the page that assembles its own <head> without going through a
      # shell, which would otherwise ship the wordmark card to everyone who
      # shared it with nothing saying so.
      - name: Regenerate every page
        run: |
          npm run build:all
          npm run verify:final
          npm run verify:seo

      - name: Fail if the committed pages were not in step
        run: |
          if ! git diff --quiet; then
            echo "::error::The committed pages are out of step with data/ and scripts/."
            echo ""
            echo "These files changed when the generators ran:"
            git diff --name-only | sed 's/^/  /'
            echo ""
            echo "Fix: run the generators locally and commit the result —"
            echo "  npm run build:all"
            echo ""
            git --no-pager diff --stat
            echo ""
            echo "What actually differs (first 200 lines) — a --stat alone has"
            echo "never been enough to tell an environment-dependent value from a"
            echo "forgotten rebuild, and that distinction is the whole diagnosis:"
            git --no-pager diff | head -200
            exit 1
          fi
          echo "Every generated page matches its inputs."
