name: Climate events — the page notices something happened

# WHY THIS EXISTS, AND WHY IT IS SEPARATE FROM EVERY OTHER JOB HERE
#
# /now/climate-event opened on an archive figure — the worst station's count of
# days over IMD's heavy-rain threshold in the last COMPLETE calendar year. That
# number is true and it CANNOT MOVE for up to twelve months at a stretch: 2025
# is finished history, and 2026 does not become "complete" until 1 January
# 2027. The daily refresh re-read the dataset every morning and wrote the same
# number back. The page was maintained and it read as abandoned, which is the
# worst combination available.
#
# This job is the missing half. It reads the news and the official alert feeds
# every thirty minutes, and when something is actually happening — in India or
# in the region upstream of it — it writes an event dossier that the page then
# opens on. When nothing is happening it says so, with the time it last looked.
#
# ★ IT IS SEPARATE FROM THE AIR JOBS IN WHAT IT READS, AND NOT IN WHAT IT
# WRITES. air-hourly.yml and data-refresh.yml are untouched by this file and
# this file is untouched by them. They share no script, no dataset and no step.
# The air pipeline's CPCB transport ladder, its bulletin cross-check and its
# exit-75 convention are its own.
#
# ★ THE SENTENCE THAT USED TO END THAT PARAGRAPH — "nothing here can turn that
# job red and nothing there can stop this one running" — WAS FALSE, and it was
# false in the direction that mattered. All three publishers commit to `main`,
# so they share the one thing that can reject a run outright. Measured on
# 29 August 2026: the air job's :13 push landed inside this job's window and
# this job's push was rejected, once an hour, for six hours. See the push step
# below for the timings, and for why the shared `publish` concurrency group did
# not prevent it. They are independent in what they read. They are not
# independent in what they write, and pretending otherwise is what left this
# job as the only publisher with no way to recover from losing the race.
#
# ★ NEWS TRIGGERS. OFFICIAL FEEDS CORROBORATE. THAT ORDER IS THE POINT.
# India's official feeds — IMD's CAP alerts, NDMA's Sachet aggregation — are
# good and they are ONLY ABOUT INDIA. A glacial lake collapsing in Nepal, a
# cloudburst in Tibet, a cyclone crossing Bangladesh: none of these reach an
# Indian government feed until they reach India, by which point they are not
# early. News is the only signal that crosses a border, so news is the trigger
# and the official feeds raise the score once the event is inside India.
#
# ★ WHAT REACHES THE PUBLIC PAGE WITHOUT A HUMAN, AND WHAT DOES NOT.
# The detector may publish: a hazard type, a place, timestamps, links, counts
# of who reported what, and headlines quoted verbatim and attributed. It may
# NOT publish a death toll, a cause or a consequence in its own voice — those
# are `claims` in the dossier and lib/climate-events.mjs refuses to build a
# page carrying a figure without a source and a confidence word. The
# analytical depth a reader sees — how many glacial lakes the Himalaya holds,
# what happened at South Lhonak in 2023, why a Nepali flood becomes a Bihari
# one — comes from the HAZARD CONTEXT PACK for the detected type, researched
# and cited in advance. Nothing is composed under deadline by a machine.
#
# ★ AND IT WILL NOT PUBLISH ON ONE STORY.
# Automatic publication needs EIGHT independent publishers, or four plus a
# matching official alert — enforced twice, once in the scorer and once again
# in the validator the page build runs. The bar started far lower and a real
# run published twenty pages, most of them ordinary monsoon reporting. Breadth
# of coverage is the discriminator: a regional disaster is carried by a hundred
# outlets, a district's waterlogging by three.
#
# ★ TWO PAGE TYPES, NOT ONE.
#   /now/climate-event          the standing picture, with a compact banner
#                               when something is happening. Annual clock.
#   /now/climate-event/<slug>   one page per published event, the full board.
#                               Hourly clock — was half-hourly; see the
#                               29 August storage note below.
# They were one page and it did not work: the board pushed the death table and
# the twelve cities below three screens of something with a different cadence.
#
# NO SECRETS. Google News RSS, The Hindu, Hindustan Times, IMD's CAP feed and
# NDMA's Sachet endpoint are all keyless. Nothing here needs a key, so unlike
# the air jobs there is no missing-secret path to report.
#
# COST, AND WHY IT WAS CUT FROM 48 RUNS A DAY TO 24. Most quiet runs still
# produce no commit — the detector stamps a clock, and
# scripts/data-refresh-changed.mjs reverts a file whose only change is a
# clock. But an ACTIVE, still-developing event is not quiet: measured
# 29 August 2026 during the Assam-flood/Nepal-GLOF window, the dossier's
# corroboration counts and extracted casualty figures were moving on nearly
# every run, so nearly every half-hour tick was a real commit — a real
# deployment, each retaining its own build artefact — for a week straight.
# That is what actually grew Vercel's Deployment Storage to ~23GB, not a
# stuck-timestamp bug (the noise filter above is working correctly). Halving
# the schedule halves the worst-case deploy count from this workflow; the
# trade is real, deliberately accepted: a fast-breaking event's page can now
# lag the news by up to an hour instead of thirty minutes. If that trade turns
# out to be wrong for a specific kind of event, the fix is a smarter
# publish-decision (taper cadence once a dossier has been stable for a few
# hours), not reverting this line — see the storage audit this commit is
# part of.

on:
  schedule:
    # Hourly at :05 — clear of air-hourly's :35 and data-refresh's :40.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read the feeds and score, but write and commit nothing'
        type: boolean
        default: true

concurrency:
  # ★ ONE PUBLISHER AT A TIME, ACROSS ALL THREE WORKFLOWS.
  # air-hourly.yml, data-refresh.yml and climate-events.yml are independent in
  # what they READ — that separation is deliberate and documented in each file —
  # but they are not independent in what they WRITE. All three commit to `data`
  # and `public/_pages`, and all three rebuild the SAME page list (situations,
  # work, about, impact, farm, act, stories, publications, posters, search,
  # essays). Three writers, one branch.
  #
  # They each used to hold a group of their own, which protects a workflow from
  # ITSELF and from nothing else. The result was measurable: data-refresh.yml
  # failed all six times it has ever run, every one at `git push` —
  #
  #   error: failed to push some refs
  #   hint: Updates were rejected because the remote contains work that you do
  #         not have locally. This is usually caused by another repository
  #         pushing to the same ref.
  #
  # It checks out, spends eight minutes fetching, and the air publisher lands
  # underneath it. Rebasing out of that is not the fix it looks like: the
  # conflicting files are generated HTML that both jobs rewrite in full, so a
  # merge resolution is a coin flip on whose figures survive, on a site whose
  # entire premise is that the figures are current.
  #
  # A shared group was meant to remove the race instead of resolving it. The
  # cost is that a daily eight-minute refresh can make one air run wait, and
  # GitHub keeps only the newest pending run per group — so an air poll may be
  # cancelled while queued. That is harmless here: the next dispatch is fifteen
  # minutes out and /api/cron/air re-dispatches on its own once no recent run
  # covers the slot.
  #
  # ★ IT DOES NOT ACTUALLY REMOVE THE RACE, and that sentence stood here
  # unchallenged for a day. Measured 29 August 2026, both runs schedule-
  # triggered, both declaring THIS group at top level with these exact values:
  #
  #   air-hourly       07:11:01 -> 07:13:20
  #   climate-events   07:12:22 -> 07:13:57      58 seconds of overlap
  #
  # GitHub started the second while the first was still running. So the group
  # is a useful reducer and not a guarantee, and every publisher needs a push
  # that can lose and recover on its own. All three now have one; this file was
  # the last, and until then it was the one that always lost.
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The detector and the generator use node built-ins only.
      - run: npm ci --omit=dev

      - name: Read the news and the alert feeds
        run: |
          # ── EXIT 75 IS NOT A FAILURE ─────────────────────────────────────
          # Same convention as air-hourly.yml. 75 means every news source was
          # silent, which is a statement about the internet and not about the
          # weather. Nothing is written, the page keeps the event it has with
          # its age printed beside it, and the run stays green. Turning it red
          # would email a human every half hour about somebody else's server,
          # which is how you train someone to ignore the alert that matters.
          set +e
          node scripts/detect-climate-events.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          code=$?
          set -e
          if [ "$code" = "75" ]; then
            echo "::notice::No news source answered. Nothing written; the page keeps what it has."
            echo "UPSTREAM_SILENT=1" >> "$GITHUB_ENV"
          elif [ "$code" != "0" ]; then
            echo "::error::detect-climate-events.mjs exited $code"
            exit "$code"
          fi

      # ── THE FIGURES AND THE PICTURE, BETWEEN DETECTION AND THE REBUILD ──
      # Both read only what the detector just wrote plus, for the imagery, a
      # keyless NASA endpoint. Neither is allowed to fail the run: a disaster
      # page that ships without a satellite frame is a page with a named gap in
      # one band, and a page that does not ship at all is a page with nothing.
      #
      # extract-event-figures is the BACKFILL path. New events arrive with
      # `impact` already filled by the detector; this catches the dossiers that
      # predate that, and is a no-op once they are done.
      #
      # fetch-event-imagery throttles itself to one probe cycle every three
      # hours per event unless a slot is still empty, which is what keeps a
      # thirty-minute schedule from becoming 2,880 requests a day to a public
      # service nobody is paying for.
      - name: Read the numbers out of the headlines, and go and get the picture
        if: env.UPSTREAM_SILENT != '1'
        run: |
          set +e
          npm run data:event-figures || echo "::warning::figure extraction failed; the pages keep what they have"
          npm run data:event-imagery || echo "::warning::imagery fetch failed; the satellite band will print its reason"
          set -e

      - name: Discard clock-only churn, keep real changes
        id: changed
        if: env.UPSTREAM_SILENT != '1'
        run: |
          # checked.json is stamped on EVERY run, including quiet ones, because
          # "we looked and nothing crossed" differs from "we have not looked".
          # It is a clock, so this reverts it when nothing else moved — the
          # page is rebuilt in this same job, so a quiet run never needs a
          # commit to stay honest.
          node scripts/data-refresh-changed.mjs | tee /tmp/changed.log
          n=$(grep -oE '^CHANGED=[0-9]+' /tmp/changed.log | tail -1 | cut -d= -f2)
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          {
            echo '### Climate event detection'
            echo ''
            echo '```'
            cat /tmp/changed.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild the page the events feed
        if: steps.changed.outputs.count != '0' && env.UPSTREAM_SILENT != '1'
        run: |
          # ★ THE VALIDATOR RUNS HERE, NOT AT DEPLOY.
          # build-situation-climate-event.mjs loads every dossier through
          # lib/climate-events.mjs, which throws on a figure without a source,
          # a hazard with no context pack, a published automated event under
          # the corroboration bar, or a published event with an empty
          # `uncertain` list. A dossier that would produce a page making an
          # unattributed claim fails THIS step, and the commit below never
          # runs. That is the whole reason the rebuild lives in this job.
          # BOTH pages, in this order. build:situations includes the standing
          # page AND build:climate-disasters, which emits one page per published
          # event. The disaster pages must exist before next build runs, because
          # design-routes.ts derives their routes from the same dossiers and
          # refuses to route a file that is not on disk.
          npm run build:situations
          # ★ AND THE HOMEPAGE, WHICH IS FED BY THE SAME DOSSIERS.
          # This step rebuilt the two situation pages and stopped, but the
          # homepage reads the very same data through homepageSlot(): the hero
          # situation slide, the climate ticker cell and the og:image all come
          # out of it. So every run of this workflow that moved an event left
          # home.html behind, main drifted out of step with its own data within
          # the hour, and "Generated pages are current" was red on every pull
          # request anyone opened — for a page none of them had touched.
          #
          # AFTER build:situations, NOT BEFORE, and the order is load-bearing
          # for the same reason air-hourly.yml states: build-hero.mjs
          # cross-checks the hero's air figure against the one already in
          # situation-air.html and refuses to write when they differ. Hero
          # first would compare against a page not yet rebuilt and stop the run.
          npm run build:hero
          npm run verify:final

      - name: Commit and push
        if: steps.changed.outputs.count != '0' && env.UPSTREAM_SILENT != '1' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  'swechha-climate-events[bot]'
          git config user.email 'actions@github.com'
          # design/ and docs/design/FINAL.md are build output too — see
          # data-refresh.yml's commit step for why omitting either breaks the
          # "generated pages are current" gate on the next pull request.
          git add -A data public/_pages design docs/design/FINAL.md
          if git diff --cached --quiet; then
            echo "Nothing staged after the rebuild — no commit."
            exit 0
          fi
          # WHICH PAGES CHANGED, recorded before the commit so the IndexNow step
          # after the push submits exactly those and nothing else. Staged-file
          # list, not a sitemap dump: the protocol asks for changed URLs, and a
          # scheduled job re-submitting an inventory every half hour is
          # indistinguishable from abuse.
          changed_pages=$(git diff --cached --name-only -- 'public/_pages/**/*.html' | tr '\n' ' ')
          echo "CHANGED_PAGES=$changed_pages" >> "$GITHUB_ENV"
          echo "Pages changed: ${changed_pages:-none}"
          summary=$(node -e '
            const fs=require("node:fs"), p="data/climate-events/active";
            if(!fs.existsSync(p)){console.log("no events");process.exit(0)}
            const live=fs.readdirSync(p).filter(f=>f.endsWith(".json"))
              .map(f=>JSON.parse(fs.readFileSync(p+"/"+f,"utf8")))
              .filter(e=>e.publish_state==="published");
            console.log(live.length ? live.map(e=>`${e.hazard} @ ${e.location.text} (${e.significance_score})`).join("; ") : "no published event");
          ')
          git commit -m "data(climate-event): ${summary}" \
            -m "Automated by .github/workflows/climate-events.yml. The detector read the news and official alert feeds, scored what it found against an itemised rubric, and wrote a dossier for anything over threshold. Every figure is attributed and status-marked; nothing is claimed in the site's own voice. The page was rebuilt in the same run and verify:final passed."

          # ── PUSH, AND WIN THE RACE THIS JOB HAD BEEN LOSING EVERY HOUR ─────
          # ★ MEASURED, 29 AUGUST 2026. This was a bare `git push`, and it was
          # the ONLY one of the three bot publishers without a retry —
          # air-hourly.yml has had one since AD-47 and data-refresh.yml got one
          # at 13d23c8. So when two publishers overlapped, this job was always
          # the one that lost:
          #
          #   air-hourly       07:11:01 -> 07:13:20   pushed AQI 415 at 07:13:16
          #   climate-events   07:12:22 -> 07:13:57   push REJECTED, run failed
          #
          #   ! [rejected]  main -> main (fetch first)
          #
          # It failed at 22:12, 23:12, 00:12, 05:12, 06:12 and 07:12 — once an
          # hour, whenever the air job's :13 push landed inside this job's
          # window. And a rejected push does not merely delay the data, it
          # DISCARDS IT: the 07:12 run had detected a new event and written
          # data/climate-events/active/meghalaya-flood.json, and that dossier
          # never reached main. A disaster page can be up to thirty minutes
          # late for a reason that has nothing to do with the disaster.
          #
          # ★ THE SHARED `publish` CONCURRENCY GROUP DOES NOT PREVENT THIS, and
          # the timings above are the proof. Both workflows declare
          # `group: publish` with `cancel-in-progress: false`, at top level,
          # identically — and GitHub still ran them with 58 seconds of overlap.
          # The group is worth keeping; it is not a guarantee, so the push has
          # to be able to lose and recover on its own.
          #
          # ★ A CONFLICT STILL FAILS LOUDLY, and deliberately. Most of this
          # commit is generated HTML that several jobs rewrite in full, so
          # "ours" and "theirs" are both whole files and picking one silently
          # reverts somebody's figures. The only cases this wins are the ones
          # that never needed resolving — a push that touched data, source or a
          # page this run did not rebuild. Same reasoning, same shape, as
          # data-refresh.yml's loop.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::notice::Push rejected on attempt ${attempt}. Fetching and replaying on top of main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase onto main conflicted, so this run's dossiers were NOT published. \
          The conflict is in files that more than one publisher rewrites in full; resolving it \
          automatically would silently discard one side's figures. Re-run this workflow — a fresh \
          fetch on top of the current main will produce a clean commit."
              exit 1
            fi
          done
          echo "::error::Could not publish after 3 attempts; main is moving faster than this job can rebase."
          exit 1


      # ── TELL THE SEARCH ENGINES, AFTER THE PUSH ─────────────────────────
      # A disaster page is worth finding on the day, and sitemap discovery is a
      # crawl schedule — hours to days, which is most of an event page's useful
      # life. One POST reaches Bing, Yandex, Seznam and Naver.
      #
      # GOOGLE IS NOT IN THAT LIST AND CANNOT BE PUSHED TO. Both legacy sitemap
      # pings are gone — google.com/ping answers 404 "Sitemaps ping is
      # deprecated", bing.com/ping answers 410 — and Google's stated
      # replacement is the sitemap `lastmod`, which this repo already computes
      # from a content hash so it moves only on a real change.
      #
      # AFTER the push, not before: IndexNow verifies ownership by fetching the
      # key file from the live host, so the submission has to follow the deploy.
      # A rejection is a warning and never fails the run — the page is already
      # published and correct; this is only a notification about it.
      - name: Submit the changed pages to IndexNow
        if: steps.changed.outputs.count != '0' && env.UPSTREAM_SILENT != '1' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if [ -z "${CHANGED_PAGES// /}" ]; then
            echo "No page files changed — nothing to submit."
            exit 0
          fi
          node scripts/ping-indexnow.mjs --changed "$CHANGED_PAGES"

      - name: Report what did not answer
        if: always()
        run: |
          if [ -n "${UPSTREAM_SILENT:-}" ]; then
            echo "Every news source was silent this run. Nothing written." >> "$GITHUB_STEP_SUMMARY"
          fi
