# Redundant scheduler for the live air pipeline.
#
# GitHub's schedule service is not a real-time scheduler and may delay or drop
# scheduled events. The primary air workflow remains the only workflow that
# fetches data, rebuilds pages and writes commits. This watchdog only checks
# whether that workflow has started recently; if not, it dispatches one run.
#
# This prevents a silent gap like 26 August 2026, when the primary pipeline had
# succeeded manually but then received no scheduled runs for hours.
name: Air scheduler watchdog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: air-schedule-watchdog
  cancel-in-progress: false

jobs:
  ensure-air-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the primary air workflow
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}/actions/workflows/air-hourly.yml/runs?per_page=1")
          started=$(printf '%s' "$latest" | jq -r '.workflow_runs[0].run_started_at // empty')
          if [ -z "$started" ]; then
            echo 'dispatch=1' >> "$GITHUB_OUTPUT"
            echo 'No primary air run found; dispatching.'
            exit 0
          fi
          started_epoch=$(date -u -d "$started" +%s)
          now_epoch=$(date -u +%s)
          age=$(( (now_epoch - started_epoch) / 60 ))
          echo "Latest primary air run started ${age} minutes ago (${started})."
          if [ "$age" -gt 18 ]; then
            echo 'dispatch=1' >> "$GITHUB_OUTPUT"
          else
            echo 'dispatch=0' >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch primary air workflow if overdue
        if: steps.check.outputs.dispatch == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}/actions/workflows/air-hourly.yml/dispatches" \
            -d '{"ref":"main","inputs":{"dry_run":"false"}}'
          echo 'Primary air workflow dispatched because no recent run was found.'
