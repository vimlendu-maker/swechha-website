name: Data refresh — the situations re-read their sources

# WHY THIS EXISTS
# Air is deliberately NOT fetched here. `.github/workflows/air-hourly.yml` is
# the sole owner of the Air datasets and its generated Air pages. Keeping a
# second workflow out of that path prevents stale daily data from racing a
# fresher 15-minute Air update and then rebuilding the site from the older copy.
#
# The other situations build from committed datasets in data/, and this job
# re-reads those sources on the daily schedule. If a figure actually moved it
# rebuilds the affected pages and commits. Vercel deploys the commit.
#
# ★ ONE FLAKY SOURCE DOES NOT BLOCK THE OTHERS. The fetch groups run
# independently, and failures are collected and reported at the end.
#
# SECRETS IT NEEDS (Settings → Secrets and variables → Actions):
#   DATA_GOV_IN_KEY   CPCB, via data.gov.in        — coverage/non-air sources
#   WAQI_TOKEN        aqicn.org                    — the air cross-check
#   FIRMS_MAP_KEY     NASA FIRMS                   — fire detections

on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report what changed, but commit nothing'
        type: boolean
        default: true

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: Report any missing keys, by name and not by value
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          missing=""
          for k in DATA_GOV_IN_KEY WAQI_TOKEN FIRMS_MAP_KEY; do
            if [ -z "$(printenv "$k")" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing secret(s):$missing — the fetches that need them will fail and be skipped."
          else
            echo "All three data keys are present."
          fi

      - name: Re-read non-air sources
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AIR_RELAY_TOKEN: ${{ secrets.AIR_RELAY_TOKEN }}
        run: |
          # IMPORTANT: no Air fetch runs here. Air is owned exclusively by
          # air-hourly.yml, which fetches, cross-checks, builds and publishes
          # it in one transaction. (The old `data:air-all` script this note
          # used to name was deleted in AD-47 — it was the last reference to
          # fetch-crosscheck.mjs while nothing called it.)
          failed=""
          for s in data:yamuna data:heat data:climate \
                   data:forest data:forest-fire data:attention data:coverage; do
            echo "::group::npm run $s"
            if npm run "$s"; then echo "ok"; else echo "::warning::$s failed"; failed="$failed $s"; fi
            echo "::endgroup::"
          done
          echo "FETCH_FAILED=${failed# }" >> "$GITHUB_ENV"

      - name: Cross-check non-air outputs
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          AIR_RELAY_TOKEN: ${{ secrets.AIR_RELAY_TOKEN }}
        run: |
          # The Air bulletin cross-check is also intentionally excluded here.
          # Air validation belongs to air-hourly.yml so that the dedicated Air
          # owner has one coherent fetch/validate/build/publish transaction.
          # ★ AD-47: that hand-off was written here on 27 August and the
          # receiving workflow never implemented its half, so the gate ran
          # NOWHERE for a day and a half. air-hourly.yml now runs it on a
          # 6-hour window. If Air validation is ever moved back, move the
          # call, not just the comment.
          echo "Air cross-check skipped here: air-hourly.yml is the sole Air owner."

      - name: Discard timestamp-only churn, keep real changes
        id: changed
        run: |
          node scripts/data-refresh-changed.mjs | tee /tmp/changed.log
          n=$(grep -oE '^CHANGED=[0-9]+' /tmp/changed.log | tail -1 | cut -d= -f2)
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          {
            echo '### Data refresh'
            echo ''
            echo '```'
            cat /tmp/changed.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild the pages the data feeds
        if: steps.changed.outputs.count != '0'
        run: |
          failed=''
          run_gate() {
            echo "::group::npm run $1"
            if npm run "$1"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::npm run $1 failed"
              failed="$failed $1"
            fi
          }

          # Air pages are rebuilt only by air-hourly.yml. The daily workflow
          # rebuilds the remaining situations and the site-wide generated pages.
          for t in situations work about impact farm act stories publications search essays; do
            echo "::group::npm run build:$t"
            if npm run "build:$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::npm run build:$t failed"
              failed="$failed build:$t"
            fi
          done
          run_gate verify:final

          if [ -n "$failed" ]; then
            echo "FAILED GATES:$failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Commit and push
        if: steps.changed.outputs.count != '0' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  'swechha-data-refresh[bot]'
          git config user.email 'actions@github.com'
          git add -A data public/_pages design docs/design/FINAL.md
          if git diff --cached --quiet; then
            echo "Nothing staged after the rebuild — no commit."
            exit 0
          fi
          files=$(git diff --cached --name-only -- data | sed 's|^data/||' | tr '\n' ' ')
          git commit -m "data: the situations re-read their sources" \
            -m "Changed: ${files:-none}" \
            -m "Automated by .github/workflows/data-refresh.yml. Air is intentionally excluded here and is owned by the dedicated 15-minute air workflow."
          git push

      - name: Report what did not refresh
        if: always()
        run: |
          if [ -n "${FETCH_FAILED:-}" ]; then
            echo "::error::These non-air sources did not refresh:${FETCH_FAILED}"
            echo "Some non-air sources failed to refresh." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Air is owned by air-hourly.yml. All non-air sources in this workflow answered."
