name: Data refresh — the situations re-read their sources

# WHY THIS EXISTS
# Air is deliberately NOT fetched here. `.github/workflows/air-hourly.yml` is
# the sole owner of the Air datasets and its generated Air pages. Keeping a
# second workflow out of that path prevents stale daily data from racing a
# fresher 15-minute Air update and then rebuilding the site from the older copy.
#
# The other situations build from committed datasets in data/, and this job
# re-reads those sources on the daily schedule. If a figure actually moved it
# rebuilds the affected pages and commits. Vercel deploys the commit.
#
# ★ ONE FLAKY SOURCE DOES NOT BLOCK THE OTHERS. The fetch groups run
# independently, and failures are collected and reported at the end.
#
# SECRETS IT NEEDS (Settings → Secrets and variables → Actions):
#   DATA_GOV_IN_KEY   CPCB, via data.gov.in        — coverage/non-air sources
#   WAQI_TOKEN        aqicn.org                    — the air cross-check
#   FIRMS_MAP_KEY     NASA FIRMS                   — fire detections

on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report what changed, but commit nothing'
        type: boolean
        default: true

concurrency:
  # ★ ONE PUBLISHER AT A TIME, ACROSS ALL THREE WORKFLOWS.
  # air-hourly.yml, data-refresh.yml and climate-events.yml are independent in
  # what they READ — that separation is deliberate and documented in each file —
  # but they are not independent in what they WRITE. All three commit to `data`
  # and `public/_pages`, and all three rebuild the SAME page list (situations,
  # work, about, impact, farm, act, stories, publications, posters, search,
  # essays). Three writers, one branch.
  #
  # They each used to hold a group of their own, which protects a workflow from
  # ITSELF and from nothing else. The result was measurable: data-refresh.yml
  # failed all six times it has ever run, every one at `git push` —
  #
  #   error: failed to push some refs
  #   hint: Updates were rejected because the remote contains work that you do
  #         not have locally. This is usually caused by another repository
  #         pushing to the same ref.
  #
  # It checks out, spends eight minutes fetching, and the air publisher lands
  # underneath it. Rebasing out of that is not the fix it looks like: the
  # conflicting files are generated HTML that both jobs rewrite in full, so a
  # merge resolution is a coin flip on whose figures survive, on a site whose
  # entire premise is that the figures are current.
  #
  # A shared group removes the race instead of resolving it. The cost is that a
  # daily eight-minute refresh can make one air run wait, and GitHub keeps only
  # the newest pending run per group — so an air poll may be cancelled while
  # queued. That is harmless here: the next dispatch is fifteen minutes out and
  # /api/cron/air re-dispatches on its own once no recent run covers the slot.
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: Report any missing keys, by name and not by value
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          missing=""
          for k in DATA_GOV_IN_KEY WAQI_TOKEN FIRMS_MAP_KEY; do
            if [ -z "$(printenv "$k")" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing secret(s):$missing — the fetches that need them will fail and be skipped."
          else
            echo "All three data keys are present."
          fi

      - name: Re-read non-air sources
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AIR_RELAY_TOKEN: ${{ secrets.AIR_RELAY_TOKEN }}
        run: |
          # IMPORTANT: no Air fetch runs here. Air is owned exclusively by
          # air-hourly.yml, which fetches, cross-checks, builds and publishes
          # it in one transaction. (The old `data:air-all` script this note
          # used to name was deleted in AD-47 — it was the last reference to
          # fetch-crosscheck.mjs while nothing called it.)
          # ★ THE LIST LIVES IN package.json, NOT HERE. It used to be spelled
          # out twice — once as `data:situations` and once as this loop — with
          # nothing keeping them equal. Adding a source to one and not the
          # other is a silent gap: the fetch simply never runs and the page
          # keeps a figure nobody notices going stale. The loop now reads the
          # alias's own definition, so package.json is the single place a
          # source is added.
          failed=""
          for s in $(node -p 'require("./package.json").scripts["data:situations"].split("&&").map(x=>x.trim().replace(/^npm run /,"")).join(" ")'); do
            echo "::group::npm run $s"
            if npm run "$s"; then echo "ok"; else echo "::warning::$s failed"; failed="$failed $s"; fi
            echo "::endgroup::"
          done
          echo "FETCH_FAILED=${failed# }" >> "$GITHUB_ENV"

      - name: Cross-check non-air outputs
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          AIR_RELAY_TOKEN: ${{ secrets.AIR_RELAY_TOKEN }}
        run: |
          # The Air bulletin cross-check is also intentionally excluded here.
          # Air validation belongs to air-hourly.yml so that the dedicated Air
          # owner has one coherent fetch/validate/build/publish transaction.
          # ★ AD-47: that hand-off was written here on 27 August and the
          # receiving workflow never implemented its half, so the gate ran
          # NOWHERE for a day and a half. air-hourly.yml now runs it on a
          # 6-hour window. If Air validation is ever moved back, move the
          # call, not just the comment.
          echo "Air cross-check skipped here: air-hourly.yml is the sole Air owner."

      - name: Discard timestamp-only churn, keep real changes
        id: changed
        run: |
          node scripts/data-refresh-changed.mjs | tee /tmp/changed.log
          n=$(grep -oE '^CHANGED=[0-9]+' /tmp/changed.log | tail -1 | cut -d= -f2)
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          {
            echo '### Data refresh'
            echo ''
            echo '```'
            cat /tmp/changed.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild the pages the data feeds
        if: steps.changed.outputs.count != '0'
        run: |
          failed=''
          run_gate() {
            echo "::group::npm run $1"
            if npm run "$1"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::npm run $1 failed"
              failed="$failed $1"
            fi
          }

          # Air pages are rebuilt only by air-hourly.yml. The daily workflow
          # rebuilds the remaining situations and the site-wide generated pages.
          for t in situations work about impact farm act stories publications posters search essays; do
            echo "::group::npm run build:$t"
            if npm run "build:$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::npm run build:$t failed"
              failed="$failed build:$t"
            fi
          done
          run_gate verify:final

          if [ -n "$failed" ]; then
            echo "FAILED GATES:$failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Commit and push
        if: steps.changed.outputs.count != '0' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  'swechha-data-refresh[bot]'
          git config user.email 'actions@github.com'
          git add -A data public/_pages design docs/design/FINAL.md
          if git diff --cached --quiet; then
            echo "Nothing staged after the rebuild — no commit."
            exit 0
          fi
          files=$(git diff --cached --name-only -- data | sed 's|^data/||' | tr '\n' ' ')
          git commit -m "data: the situations re-read their sources" \
            -m "Changed: ${files:-none}" \
            -m "Automated by .github/workflows/data-refresh.yml. Air is intentionally excluded here and is owned by the dedicated 15-minute air workflow."

          # ── PUSHING AGAINST A MOVING BRANCH ──────────────────────────────
          # The shared `publish` concurrency group above keeps the three bot
          # publishers off each other, which is what was actually breaking this
          # step. It cannot keep a HUMAN off it: a pull request merged during
          # the eight minutes this job spends fetching rejects the push just as
          # surely, and then a day of readings is thrown away for a race that a
          # single retry would have won.
          #
          # ★ IT REBASES ONLY WHEN THE REBASE IS CLEAN, AND NEVER RESOLVES.
          # Most of this commit is generated HTML that several jobs rewrite in
          # full. There is no honest automatic resolution for a conflict in a
          # built page — "ours" and "theirs" are both whole files, and picking
          # one silently reverts somebody's figures. So a conflict aborts and
          # fails the run loudly, which is the same outcome as before this loop
          # existed. The only behaviour added is winning the cases that never
          # needed resolving: a merge that touched docs, or source, or a page
          # this run did not rebuild.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::notice::Push rejected on attempt ${attempt}. Fetching and replaying on top of main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase onto main conflicted, so this run's data was NOT published. \
          The conflict is in files that more than one publisher rewrites in full; resolving it \
          automatically would silently discard one side's figures. Re-run this workflow — a fresh \
          fetch on top of the current main will produce a clean commit."
              exit 1
            fi
          done
          echo "::error::Still could not push after 3 attempts; main is moving faster than this job can land."
          exit 1

      - name: Report what did not refresh
        if: always()
        run: |
          if [ -n "${FETCH_FAILED:-}" ]; then
            echo "::error::These non-air sources did not refresh:${FETCH_FAILED}"
            echo "Some non-air sources failed to refresh." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Air is owned by air-hourly.yml. All non-air sources in this workflow answered."
