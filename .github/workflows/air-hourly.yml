name: Air, every 15 minutes — live poll and timestamp

# One successful poll must update the committed data and the visible
# "last checked" timestamp even when CPCB is still publishing the same AQI.
on:
  schedule:
    - cron: '4 * * * *'
    - cron: '19 * * * *'
    - cron: '34 * * * *'
    - cron: '49 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and rebuild, but do not commit or push'
        type: boolean
        default: false

concurrency:
  group: air-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  air:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Record trigger
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Scheduled slot: ${{ github.event.schedule }}"
          echo "Started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Fetch Delhi and India air data
        id: fetch
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          AIR_RELAY_TOKEN: ${{ secrets.AIR_RELAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_GOV_IN_KEY:-}" ]; then
            echo "::error::DATA_GOV_IN_KEY is not set."
            exit 1
          fi
          set +e
          npm run data:air
          code=$?
          set -e
          if [ "$code" = "75" ]; then
            echo "::warning::API silent or rate-limited; proceeding with execution."
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi
          echo "upstream_silent=false" >> "$GITHUB_OUTPUT"

      - name: Stop if upstream did not answer
        if: steps.fetch.outputs.upstream_silent == 'true'
        run: echo "No successful source check; no rebuild and no timestamp update."

      - name: Rebuild pages after every successful poll
        if: steps.fetch.outputs.upstream_silent != 'true'
        run: |
          npm run build:situations
          npm run build:hero
          for t in work about impact farm act stories publications search essays; do
            npm run "build:$t"
          done
          npm run verify:final
      - name: Commit and push every successful poll
        if: steps.fetch.outputs.upstream_silent != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          set -euo pipefail
          git config user.name 'swechha-bot[bot]'
          git config user.email 'actions@github.com'
          git add -A data public/_pages design
          if git diff --cached --quiet; then
            echo "No data changes generated."
            exit 0
          fi
          git commit -m "$(node -e '
            const d = JSON.parse(require("fs").readFileSync("data/air-delhi.json"));
            console.log(`data(air): checked — AQI ${d.city_reading?.aqi ?? "N/A"}, observed ${d.time?.cpcb_observed_ist ?? "unknown"}`);
          ')"
          
          git fetch origin main
          git rebase origin/main -X ours || (git checkout --ours . && git add -A && git rebase --continue)
          git push origin main

      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true'
        run: echo "Dry run completed. Nothing was committed or pushed."
