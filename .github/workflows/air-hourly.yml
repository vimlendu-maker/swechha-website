name: Air, every 15 minutes — live poll and timestamp

# Sole publisher of committed Air data. A run has three explicit outcomes:
# SUCCESS: Delhi fetch/build/commit/push completed.
# UPSTREAM_UNAVAILABLE: Delhi sources were silent/unusable; previous data is preserved.
# PIPELINE_FAILURE: a real workflow/build/push error turns the run red.
#
# IMPORTANT: this 15-minute heartbeat intentionally fetches DELHI ONLY.
# The national table is much larger and has its own workflow/cadence. A failure
# in the national fetch must never block Delhi's visible AQI or last-checked time.
on:
  schedule:
    - cron: '4 * * * *'
    - cron: '19 * * * *'
    - cron: '34 * * * *'
    - cron: '49 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and rebuild, but do not commit or push'
        type: boolean
        default: false

concurrency:
  group: air-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  air:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Record trigger
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Scheduled slot: ${{ github.event.schedule }}"
          echo "Started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Fetch Delhi air data
        id: fetch
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          AIR_RELAY_TOKEN: ${{ secrets.AIR_RELAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_GOV_IN_KEY:-}" ]; then
            echo "::error::DATA_GOV_IN_KEY is not set."
            exit 1
          fi

          set +e
          npm run data:air:delhi
          code=$?
          set -e

          if [ "$code" = "0" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "::notice::Delhi Air sources returned usable data."
            exit 0
          fi

          if [ "$code" = "75" ]; then
            echo "state=upstream_unavailable" >> "$GITHUB_OUTPUT"
            echo "::warning::Delhi Air sources were silent, rate-limited, or returned no usable data. Previous committed data is intentionally preserved."
            exit 0
          fi

          echo "state=pipeline_failure" >> "$GITHUB_OUTPUT"
          echo "::error::Delhi fetch failed with exit code $code."
          exit "$code"

      - name: Report upstream unavailable
        if: steps.fetch.outputs.state == 'upstream_unavailable'
        run: |
          echo "## Air poll: upstream unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo "No new usable Delhi Air reading was obtained, so nothing was rebuilt or published." >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild Air pages after successful Delhi poll
        if: steps.fetch.outputs.state == 'success'
        run: |
          set -euo pipefail
          npm run build:situation-air
          npm run build:hero
          npm run verify:final

      - name: Commit and push successful Delhi poll
        if: steps.fetch.outputs.state == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          set -euo pipefail
          git config user.name 'swechha-air-hourly[bot]'
          git config user.email 'actions@github.com'
          git add data/air-delhi.json data/air-history.ndjson public/_pages/v3/situation-air.html public/_pages/v3/home.html design/home.html

          if git diff --cached --quiet; then
            echo "::error::Successful Delhi Air poll produced no staged changes. The fetch pipeline must update the checked timestamp or data on every successful poll."
            exit 1
          fi

          aqi=$(node -p 'JSON.parse(require("fs").readFileSync("data/air-delhi.json","utf8")).city_reading?.aqi ?? "N/A"')
          checked=$(node -p 'JSON.parse(require("fs").readFileSync("data/air-delhi.json","utf8")).time?.swechha_checked_utc ?? JSON.parse(require("fs").readFileSync("data/air-delhi.json","utf8")).fetched?.epochMs ?? "unknown"')
          git commit -m "data(air): checked — AQI ${aqi}, checked ${checked}"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Published Air update on attempt $attempt."
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done

          echo "::error::Could not safely publish the Air update after 3 attempts."
          exit 1

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && steps.fetch.outputs.state == 'success'
        run: |
          echo "## Air poll dry run succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "Usable Delhi data was fetched and Air pages rebuilt, but nothing was committed or pushed." >> "$GITHUB_STEP_SUMMARY"

      - name: Final outcome summary
        if: always()
        run: |
          echo "## Air workflow outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "Fetch state: ${{ steps.fetch.outputs.state || 'not reached' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow conclusion: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
