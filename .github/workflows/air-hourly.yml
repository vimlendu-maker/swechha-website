# The FILE is still air-hourly.yml on purpose: dispatch scripts and session
# history reference it by filename, and renaming a workflow file orphans both.
# Only the display name below says what the cadence now is.
name: Air, every 15 minutes — the one reading that moves inside a day

# WHY THIS EXISTS, AND WHY IT IS SEPARATE FROM data-refresh.yml
#
# AD-27.6-A. The client's complaint was "AQI 311 appears for a split second,
# and then the realtime data. What is this? Fix it." The fix has two halves and
# this is the second one.
#
# The first half is in the pages: nothing repaints a reading any more. The
# numeral on the homepage and on /now/air is written by the build, and no
# script may write a digit over it. That removes the flash by construction —
# measured, ten cold loads at 1280x800 on a throttled connection, 0 of 10.
#
# But a figure that never repaints is only as good as the last build, and the
# daily job left it up to 24 hours behind: on 23 August the homepage was
# serving a 22 August 10:00 observation. So this job re-reads CPCB EVERY HOUR
# and rebuilds the two pages that carry the figure. The reading a visitor sees
# is then the current or the previous CPCB hour, and the chip can honestly
# reach LIVE — it flips only when the live fetch confirms the figure on the
# page, which is nearly always true when the page is an hour old and never true
# when it is a day old.
#
# ★ HOURLY IS FOR AIR AND FOR NOTHING ELSE.
# data-refresh.yml's own note explains why IT is daily: of its sources the
# fastest is FIRMS on a rolling 5-day window and the slowest are annual
# publications, so hourly would re-download an annual dataset 24 times a day to
# write the same number back. That reasoning is correct and untouched. Air is
# the single exception — CPCB advances the entire city one hour at a time — and
# it gets its own job rather than dragging thirty datasets along with it.
#
# ★ IT COMMITS A FIGURE, NOT A CLOCK.
# fetch-air.mjs stamps `fetched.epochMs` on every run, so a naive job would
# commit twenty-four times a day whether or not the AQI moved. The check below
# compares the AQI, the band and the observation hour that are actually
# RENDERED; if none of them moved, the working tree is reset and the run ends
# with no commit and no deploy. A still hour costs nothing.
#
# ★ SITUATIONS BEFORE THE HERO, AND THAT ORDER IS LOAD-BEARING.
# build-hero.mjs cross-checks the hero's figure against the figure already in
# situation-air.html and refuses to write if they differ. Build the hero first
# and it compares a fresh number against a page that has not been rebuilt yet,
# fails, and stops the run — which is what data-refresh.yml did daily until
# 23 August. The situation shell reads home.html's CSS by line range from the
# frozen region above line 3033 and build-hero.mjs only ever edits below it
# (and asserts the line count is unchanged), so the shell is identical either
# way and there is no cost to this order.
#
# ★ A FAILED GATE IS NEVER COMMITTED. The generators validate what they read
# and refuse to write on a failed check, and `verify:final` runs before the
# commit step. A dataset that would produce a wrong page fails the run and
# lands nothing.
#
# SECRET IT NEEDS: DATA_GOV_IN_KEY (CPCB, via data.gov.in). Without it the
# fetch fails, nothing is committed, and the pages keep the reading they have —
# which is still correct, still stamped with its own hour, and still says
# PERIODIC. An error is not a zero.
#
# COST, STATED SO IT CAN BE RECONSIDERED: up to 24 runs a day, each about two
# minutes, and up to 24 production deploys on the hours the figure moves. If
# that is too many, the honest lever is the cron below — every second or third
# hour degrades the freshness of the stamp, not its truthfulness, because the
# page always prints the hour it is actually showing.

on:
  schedule:
    # Every FIFTEEN minutes, at UTC :04/:19/:34/:49 — which is IST
    # :34/:49/:04/:19. CPCB publishes each top-of-hour observation 15–35
    # minutes late (measured 26 August: the 12:00 observation appeared ~12:30
    # IST, 14:00 by ~14:35, 16:00 by ~16:30), so the IST :34 slot catches the
    # common ~:30 publish almost immediately and the worst case for a ~:35
    # publish is the :49 pickup — the reading is never more than ~15 minutes
    # behind its own publication. This is also the owner's stated cadence
    # (AD-46): poll every 15 minutes, and treat most polls as re-checks of an
    # observation already held, never as new data.
    # THE COST IS NOTHING REAL: the repo is public (Actions minutes are free),
    # a run takes 1-3 minutes, and a run that finds the same observation
    # already committed stops itself at the "did the figure move?" gate and
    # the monotonicity guard — off-hours runs are deliberate no-ops, not churn.
    # The one exception is the HEARTBEAT below, bounded at ~1 commit/hour.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and rebuild, report what moved, but commit nothing'
        type: boolean
        default: true

concurrency:
  # An hourly job that overruns must not race the next one into a push.
  group: air-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  air:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The fetchers and the generators use node built-ins only.
      - run: npm ci --omit=dev

      - name: Read CPCB — the city reading and the national table, in one run
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          # The transport ladder's third rung (AD-45): when this runner's own
          # egress to the CPCB-side hosts dies — as it did mid-afternoon on
          # 26 August 2026, after days of clean hourly fetches — the fetch is
          # relayed through swechha.in/api/relay, which runs in Vercel Mumbai
          # next to the sources. Without the token the rung skips itself and
          # the ladder behaves exactly as before. Exit 75 now means direct
          # fetch AND curl AND the relay were all silent.
          AIR_RELAY_TOKEN: ${{ secrets.AIR_RELAY_TOKEN }}
        run: |
          if [ -z "${DATA_GOV_IN_KEY}" ]; then
            echo "::error::DATA_GOV_IN_KEY is not set. Nothing fetched, nothing committed."
            exit 1
          fi
          # BOTH, ALWAYS, IN ONE STEP. /now/air states that the hero and the
          # eight-city panel were read together at one hour, and
          # build-situation-air.mjs now refuses to build a page where that is
          # untrue. air-delhi.json and air-india.json must therefore move
          # together or not at all. They are NOT decoupled to make this step
          # more likely to pass — a half-updated pair is a page that lies.
          #
          # ── EXIT 75 IS NOT A FAILURE ──────────────────────────────────────
          # data.gov.in refused roughly HALF of these hourly runs between
          # 23 and 26 August 2026, always the same way: undici gives up after
          # a 10-second connect timeout. Nothing is written when that happens,
          # the previous reading stands with its age printed beside it, and
          # that is the designed failure mode (D-21.5) working — not a defect.
          #
          # Turning the job red for it emailed a human every other hour about
          # someone else's flaky server, which is how you train someone to
          # ignore the alert that matters. So the fetch scripts now separate
          # the two cases and this step does too:
          #
          #   75  the source did not answer      -> skip the rest, stay green
          #    1  the source answered wrongly    -> fail loudly; that one is ours
          #
          # Each attempt now tries two transports — native fetch, then curl -4
          # (scripts/lib/fetch-cpcb.mjs), the one transport measured to get
          # through the connect stall — so 75 should be rare. When it is not, the
          # honest lever is the cron above, not a louder alarm.
          set +e
          npm run data:air
          code=$?
          set -e
          if [ "$code" = "75" ]; then
            # ★ REVERT BOTH FILES, ALWAYS. data:air chains the two scripts, so
            # the city fetch can SUCCEED and write air-delhi.json before the
            # national fetch gives up — which is exactly what happened in the
            # failing runs. Left alone, the next step would see Delhi's figure
            # move, rebuild, and commit a half-updated pair: the precise state
            # the "together or not at all" rule above exists to prevent, and
            # one that build-situation-air.mjs would be right to refuse.
            # Reverting also makes `changed` come out 0, so the job stops on
            # its own path rather than needing a second condition.
            git checkout -- data/air-delhi.json data/air-india.json
            echo "::notice::CPCB did not answer this hour. Nothing written, nothing committed; "\
                 "the pages keep their committed reading and print its age."
            echo "UPSTREAM_SILENT=1" >> "$GITHUB_ENV"
          elif [ "$code" != "0" ]; then
            echo "::error::data:air exited $code — the source answered and the answer was wrong."
            exit "$code"
          fi

      - name: Did the rendered figure actually move?
        id: moved
        run: |
          # The comparison is on what the PAGES render — the AQI, the band and
          # the observation stamp — not on the file's bytes, which carry a
          # fetch timestamp that changes every run by design.
          #
          # ── THE HEARTBEAT — AD-46 ─────────────────────────────────────────
          # The pages now print "last checked" beside "observed", and both are
          # committed build artefacts: a poll that finds no new observation
          # normally commits nothing, so the committed "last checked" would
          # lag reality by however long CPCB sits still. That is a label that
          # stops describing the thing beside it — the same species of error
          # as the LIVE chip over a ten-hour-old number. So when the figure
          # did NOT move but the last air commit is older than 60 minutes,
          # this run commits anyway, purely to refresh the two timestamps and
          # the history store's checks. THE CHURN IS BOUNDED: at most ~1
          # commit/hour when the air is static (four polls/hour, three stop at
          # this gate), and zero extra when the figure moves hourly as usual —
          # a moving figure resets the age. A silent upstream (exit 75) never
          # heartbeats: nothing was checked, so there is nothing to refresh.
          node -e '
            const { execSync } = require("node:child_process");
            const fs = require("node:fs");
            const now = JSON.parse(fs.readFileSync("data/air-delhi.json", "utf8"));
            const was = JSON.parse(execSync("git show HEAD:data/air-delhi.json", { encoding: "utf8" }));
            const key = (d) => [d.city_reading?.aqi, d.city_reading?.band, d.city_reading?.station,
              d.observed?.y, d.observed?.m, d.observed?.d, d.observed?.hh, d.observed?.mi].join("|");
            const a = key(was), b = key(now);
            console.log("was: " + a);
            console.log("now: " + b);
            const changed = a === b ? "0" : "1";
            let heartbeat = "0";
            if (changed === "0" && process.env.UPSTREAM_SILENT !== "1") {
              const last = Number(execSync("git log -1 --format=%ct -- data/air-delhi.json", { encoding: "utf8" }).trim());
              const ageMin = Math.round((Date.now() / 1000 - last) / 60);
              console.log("last air commit is " + ageMin + " minutes old");
              if (ageMin > 60) { heartbeat = "1"; console.log("HEARTBEAT: committing refreshed timestamps so \"last checked\" stays honest"); }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "changed=" + changed + "\nheartbeat=" + heartbeat + "\n");
          ' | tee /tmp/air.log
          {
            echo '### Air, hourly'
            echo ''
            echo '```'
            cat /tmp/air.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing moved — put the fetch timestamps back and stop
        if: steps.moved.outputs.changed == '0' && steps.moved.outputs.heartbeat != '1'
        run: |
          # The history store keeps whatever this run recorded (a `checks`
          # increment on a known observation) UNCOMMITTED — the runner is
          # ephemeral, so it evaporates with the run. That is deliberate:
          # `checks`/`last_checked` in the committed store count only the
          # checks that survived to a commit, and the heartbeat bounds how
          # stale that can get at ~60 minutes.
          git checkout -- data/air-delhi.json data/air-india.json data/air-history 2>/dev/null || \
            git checkout -- data/air-delhi.json data/air-india.json
          git clean -fd data/air-history >/dev/null 2>&1 || true
          echo "CPCB is publishing the same observation. No rebuild, no commit, no deploy."

      - name: Rebuild the two pages that carry the reading
        if: steps.moved.outputs.changed == '1' || steps.moved.outputs.heartbeat == '1'
        run: |
          # ORDER IS LOAD-BEARING — see the note at the top of this file.
          echo "::group::npm run build:situations"
          npm run build:situations
          echo "::endgroup::"
          echo "::group::npm run build:hero"
          npm run build:hero
          echo "::endgroup::"
          # The rest of the site extracts its shell from home.html, so it is
          # rebuilt too: a page whose inputs did not move re-emits
          # byte-identically and produces no diff, which costs seconds and
          # removes a judgement call about which pages the shell reaches.
          for t in work about impact farm act stories publications search essays; do
            echo "::group::npm run build:$t"
            npm run "build:$t"
            echo "::endgroup::"
          done
          npm run verify:final

      - name: Commit and push
        if: (steps.moved.outputs.changed == '1' || steps.moved.outputs.heartbeat == '1') && github.event.inputs.dry_run != 'true'
        env:
          HEARTBEAT: ${{ steps.moved.outputs.heartbeat }}
        run: |
          git config user.name  'swechha-air-hourly[bot]'
          git config user.email 'actions@github.com'
          # ★ design/ IS A BUILD OUTPUT TOO, AND LEAVING IT OUT BROKE EVERY PR.
          # build-hero.mjs writes BOTH design/home.html (the source, comments
          # intact) and public/_pages/v3/home.html (the shipped, stripped
          # copy). Staging only the second left design/home.html stale after
          # every automated run, so the "Generated pages are current" gate —
          # which regenerates everything and fails if the tree moves — failed
          # on the next pull request opened by anyone, for a change that
          # touched none of it.
          git add -A data public/_pages design
          if git diff --cached --quiet; then
            echo "Nothing staged after the rebuild — no commit."
            exit 0
          fi
          aqi=$(node -p 'JSON.parse(require("fs").readFileSync("data/air-delhi.json","utf8")).city_reading.aqi')
          obs=$(node -p 'const o=JSON.parse(require("fs").readFileSync("data/air-delhi.json","utf8")).observed; `${String(o.hh).padStart(2,"0")}:${String(o.mi).padStart(2,"0")} IST, ${o.d}-${o.m}-${o.y}`')
          if [ "$HEARTBEAT" = "1" ]; then
            git commit -m "data(air): heartbeat — AQI ${aqi} unchanged (observed ${obs}), timestamps refreshed" \
              -m "Automated by .github/workflows/air-hourly.yml. AD-46: the pages print when Swechha last checked CPCB beside when CPCB observed, and both are committed build artefacts — so when the observation sits still for over an hour, this commit refreshes the check time (and the history store's checks count) rather than letting the page claim a check that is hours old. Bounded at ~1 commit/hour while the air is static."
          else
            git commit -m "data(air): Delhi AQI ${aqi}, observed ${obs}" \
              -m "Automated by .github/workflows/air-hourly.yml. AD-27.6-A: the homepage and /now/air render the committed reading and nothing repaints it, so the reading is only as fresh as the last build. This is that build. Committed only because the rendered figure, band, station or observation hour actually moved; the pages were rebuilt in the same run and every generator gate passed."
          fi
          git push
